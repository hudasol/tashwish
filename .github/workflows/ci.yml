name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: python -m pip install -e ".[api,dev]"
      - name: Lint
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Command line smoke test
        run: |
          tashwish --version
          tashwish doctor
      - name: Tests with coverage
        run: python -m pytest --cov=tashwish --cov-report=term-missing:skip-covered
      - name: Coverage summary
        if: always()
        shell: bash
        run: |
          {
            echo "### Coverage, Python ${{ matrix.python-version }} on ${{ matrix.os }}"
            echo
            python -m coverage report --format=markdown --skip-covered || true
          } >> "$GITHUB_STEP_SUMMARY"
