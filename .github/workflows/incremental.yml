name: Incremental run

# Free tier design: public repository, GitHub-hosted runner, default GITHUB_TOKEN only, no secrets, no paid service.
# Writes ONLY to the `data` branch (never main). See docs/OPERATIONS.md.

on:
  schedule:
    # Weekly, Monday 03:17 UTC (off the hour on purpose). NOTE: 3 days per run cannot keep pace with 7 archive days
    # per week; see docs/OPERATIONS.md section 4 before choosing a cadence.
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      max_days:
        description: "Archive days to process this run (1 to 3; values above 3 are capped)"
        required: false
        default: "3"
      start_day:
        description: "Optional first day to process, YYYY-MM-DD (use for backfill)"
        required: false
        default: ""

# Runs never overlap. A queued run waits; a running one is never cancelled (it would leave a half downloaded spool).
concurrency:
  group: tashwish-incremental
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

env:
  PAUSE_SECONDS: "120"
  MAX_DAYS_CAP: "3"

jobs:
  incremental:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install
        run: pip install -e ".[dev]"

      - name: Validate inputs
        env:
          IN_MAX_DAYS: ${{ inputs.max_days }}
          IN_START_DAY: ${{ inputs.start_day }}
        run: |
          set -eu
          max_days="${IN_MAX_DAYS:-3}"
          case "$max_days" in ''|*[!0-9]*) echo "max_days must be an integer" >&2; exit 2;; esac
          [ "$max_days" -lt 1 ] && max_days=1
          [ "$max_days" -gt "$MAX_DAYS_CAP" ] && max_days="$MAX_DAYS_CAP"
          start_day="${IN_START_DAY:-}"
          if [ -n "$start_day" ]; then
            case "$start_day" in [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;; *) echo "start_day must be YYYY-MM-DD" >&2; exit 2;; esac
            python -c "import datetime,sys; datetime.date.fromisoformat(sys.argv[1])" "$start_day"
          fi
          echo "MAX_DAYS=$max_days" >> "$GITHUB_ENV"
          echo "START_DAY=$start_day" >> "$GITHUB_ENV"

      # Guard first: if the pipeline code is broken, stop before touching any data.
      - name: Pipeline guard tests
        run: |
          set -eu
          shopt -s nullglob
          pytest -p no:cacheprovider \
            tests/test_source.py tests/test_pipeline.py tests/test_trace.py tests/test_quality_config.py \
            tests/test_split.py tests/test_check_freshness.py \
            tests/test_operate*.py tests/test_release*.py

      # `data` branch checked out as a second working tree; state/ (frozen baseline) comes from main.
      - name: Prepare data branch worktree
        run: |
          set -eu
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin data >/dev/null 2>&1; then
            git fetch origin data
            git worktree add -B data dbranch origin/data
          else
            git worktree add --detach dbranch
            git -C dbranch checkout --orphan data
            git -C dbranch rm -rf --quiet . || true
          fi
          mkdir -p dbranch/processed dbranch/web/data dbranch/release "$RUNNER_TEMP/spool"
          df -h . | tail -1

      # Sequential days, one CLI call per day with a pause between, so politeness does not depend on the CLI internals.
      # A failure stops the loop; days already finished stay in processed/ and are still built and published below.
      - name: Ingest and score (sequential, polite)
        id: inc
        continue-on-error: true
        timeout-minutes: 200
        run: |
          set -u -o pipefail
          log="$RUNNER_TEMP/incremental.log"
          : > "$log"
          i=1
          while [ "$i" -le "$MAX_DAYS" ]; do
            args=(--state state --processed dbranch/processed --spool "$RUNNER_TEMP/spool" --max-days 1)
            if [ "$i" -eq 1 ] && [ -n "$START_DAY" ]; then args+=(--start-day "$START_DAY"); fi
            echo "== day slot $i of $MAX_DAYS: python -m tashwish.operate.incremental ${args[*]}" | tee -a "$log"
            python -m tashwish.operate.incremental "${args[@]}" 2>&1 | tee -a "$log"
            rc=${PIPESTATUS[0]}
            if [ "$rc" -ne 0 ]; then echo "incremental exited $rc" | tee -a "$log"; exit "$rc"; fi
            rm -rf "$RUNNER_TEMP/spool"/* 2>/dev/null || true
            if [ "$i" -lt "$MAX_DAYS" ]; then sleep "$PAUSE_SECONDS"; fi
            i=$((i + 1))
          done

      - name: Build dashboard JSON, dataset, data card, checksums
        id: build
        if: ${{ !cancelled() }}
        run: |
          set -u -o pipefail
          python -m tashwish.release.build --processed dbranch/processed --web dbranch/web/data --release dbranch/release \
            2>&1 | tee -a "$RUNNER_TEMP/incremental.log"

      - name: Freshness report
        if: ${{ !cancelled() }}
        run: python scripts/check_freshness.py dbranch/processed/freshness.json || true

      - name: Commit to data branch
        if: ${{ !cancelled() }}
        run: |
          set -eu
          cd dbranch
          git add processed web/data release
          if git diff --cached --quiet; then
            echo "nothing changed"
          else
            git commit -m "data: incremental run ${GITHUB_RUN_ID} ($(date -u +%FT%TZ))"
            git push origin data
          fi

      - name: Fail the job if ingest or build failed
        if: ${{ steps.inc.outcome == 'failure' || steps.build.outcome == 'failure' }}
        run: |
          echo "ingest outcome: ${{ steps.inc.outcome }}, build outcome: ${{ steps.build.outcome }}" >&2
          exit 1

      - name: Close tracking issue after a good run
        if: ${{ success() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          n=$(gh issue list --state open --search '"Incremental run failed" in:title' --json number,title \
            --jq '[.[] | select(.title == "Incremental run failed")][0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "Recovered: run ${GITHUB_RUN_ID} succeeded ($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID). Closing."
            gh issue close "$n"
          fi

      # Failure handler: keep serving the last good dataset, flag it, and open or update ONE tracking issue.
      - name: Record failure and open or update the tracking issue
        if: ${{ failure() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -u
          tail_txt="$(tail -n 60 "$RUNNER_TEMP/incremental.log" 2>/dev/null || echo '(no log captured; the failure was before the ingest step)')"
          reason="$(printf '%s' "$tail_txt" | tail -n 3 | tr '\n' ' ')"
          if [ -d dbranch ] && [ -d dbranch/.git -o -f dbranch/.git ]; then
            python scripts/check_freshness.py dbranch/processed/freshness.json --mark-failed "$reason" || true
            (
              cd dbranch
              git add processed/freshness.json
              if ! git diff --cached --quiet; then
                git commit -m "data: mark run ${GITHUB_RUN_ID} failed (last good dataset still served)"
                git push origin data || echo "could not push failure status"
              fi
            ) || true
            fresh="$(python scripts/check_freshness.py dbranch/processed/freshness.json 2>&1 || true)"
          else
            fresh="(data branch worktree not prepared)"
          fi
          run_url="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          body="$(printf 'Run: %s\n\nFreshness now: %s\n\nLog tail:\n```\n%s\n```\n\nRecovery steps: docs/OPERATIONS.md section 6.' "$run_url" "$fresh" "$tail_txt")"
          n=$(gh issue list --state open --search '"Incremental run failed" in:title' --json number,title \
            --jq '[.[] | select(.title == "Incremental run failed")][0].number // empty')
          if [ -n "$n" ]; then
            gh issue comment "$n" --body "$body"
          else
            gh issue create --title "Incremental run failed" --body "$body"
          fi
