[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tashwish"
dynamic = ["version"]
description = "Tashwish: open, reproducible Gulf GNSS interference observatory from public ADS-B data. Research and monitoring tool, not for navigation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Huda Mueen" }]
dependencies = [
  "duckdb>=1.1",
  "h3>=4.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=16",
  "scipy>=1.12",
  "tabulate>=0.9",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27"]
dev = ["pytest>=8", "pytest-cov>=5", "hypothesis>=6", "ruff>=0.5"]

[project.scripts]
tashwish = "tashwish.cli:main"

[tool.setuptools.dynamic]
version = { attr = "tashwish.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tashwish = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM"]
ignore = ["E501", "N818", "SIM105", "SIM115"]

[tool.ruff.lint.per-file-ignores]
"web/scripts/*.py" = ["SIM108", "B007", "N806"]
"scripts/make_results_docs.py" = ["N806", "E741"]
