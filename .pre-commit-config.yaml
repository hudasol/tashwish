# Install with: pip install pre-commit && pre-commit install
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.0
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
        exclude: '\.(parquet|gz|png)$|^(processed|state|results|release|web/data)/'
      - id: trailing-whitespace
        exclude: '\.(md|parquet|gz|png)$|^(processed|state|results|release|web/data)/'
